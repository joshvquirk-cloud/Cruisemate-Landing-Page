<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CruiseMate Field Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0f0a;--surface:#111911;--border:#1e2e1e;--green:#2ecc71;--green-dim:#1a6b2f;
    --green-glow:rgba(46,204,113,0.15);--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;
    --text:#e8f5e8;--muted:#4a6b4a;--mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:1000;}
  #pwScreen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}
  #pwScreen .logo{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:4px;color:var(--green);}
  #pwScreen .sub{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:2px;}
  #pwInput{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 20px;font-family:var(--mono);font-size:18px;color:var(--text);text-align:center;outline:none;width:240px;letter-spacing:4px;}
  #pwInput:focus{border-color:var(--green-dim);}
  #pwBtn{background:var(--green-glow);border:1px solid var(--green);color:var(--green);font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;padding:12px 40px;border-radius:8px;cursor:pointer;}
  #pwError{color:var(--red);font-family:var(--mono);font-size:12px;display:none;}
  #app{display:none;}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);}
  .logo-sm{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;color:var(--green);}
  .logo-sm span{color:var(--muted);}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px;transition:background 0.3s;}
  .status-dot.active{background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.5s ease-in-out infinite;}
  .status-dot.warning{background:var(--amber);box-shadow:0 0 8px var(--amber);}
  .status-dot.error{background:var(--red);}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
  .status-label{font-size:11px;font-family:var(--mono);color:var(--muted);}
  .coords-bar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:6px 20px;background:var(--bg);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--muted);}
  .coords-bar span{color:var(--text);}
  .speed-section{text-align:center;padding:24px 20px 16px;}
  .speed-ring{width:200px;height:200px;margin:0 auto 12px;position:relative;display:flex;align-items:center;justify-content:center;}
  .speed-ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
  .speed-ring circle{fill:none;stroke-width:4;}
  .ring-bg{stroke:var(--border);}
  .ring-fill{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset 0.5s ease,stroke 0.3s;stroke-dasharray:628;stroke-dashoffset:628;}
  .speed-inner{text-align:center;z-index:1;}
  .speed-value{font-family:'Bebas Neue',sans-serif;font-size:72px;line-height:1;color:var(--green);letter-spacing:-2px;transition:color 0.3s;text-shadow:0 0 40px rgba(46,204,113,0.3);}
  .speed-unit{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:2px;}
  .intersection-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(245,158,11,0.1);border:1px solid var(--amber);border-radius:6px;padding:6px 14px;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--amber);opacity:0;transition:opacity 0.3s;}
  .intersection-badge.visible{opacity:1;animation:pulse-amber 1s ease-in-out infinite;}
  @keyframes pulse-amber{0%,100%{opacity:1}50%{opacity:0.6}}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .stat-cell{background:var(--surface);padding:12px 8px;text-align:center;}
  .stat-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--green);letter-spacing:1px;}
  .stat-lbl{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
  .section{padding:14px 20px;border-bottom:1px solid var(--border);}
  .section-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--muted);margin-bottom:10px;}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{padding:13px;border-radius:6px;border:1px solid;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;transition:all 0.15s;-webkit-user-select:none;user-select:none;}
  .btn:active{transform:scale(0.97);}
  .btn-green{background:var(--green-glow);border-color:var(--green);color:var(--green);}
  .btn-red{background:rgba(239,68,68,0.1);border-color:var(--red);color:var(--red);}
  .btn-blue{background:rgba(59,130,246,0.1);border-color:var(--blue);color:var(--blue);}
  .btn-muted{background:transparent;border-color:var(--border);color:var(--muted);}
  .btn-full{grid-column:1/-1;}
  .btn:disabled{opacity:0.3;cursor:not-allowed;}
  .note-row{display:flex;gap:10px;margin-bottom:10px;}
  .note-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color 0.2s;}
  .note-input:focus{border-color:var(--green-dim);}
  .note-input::placeholder{color:var(--muted);}
  .log-section{padding:14px 20px 90px;}
  .log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .log-count{font-family:var(--mono);font-size:10px;color:var(--muted);}
  .log-list{display:flex;flex-direction:column;gap:6px;}
  .log-entry{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:11px;}
  .log-entry.type-intersection{border-left:3px solid var(--amber);}
  .log-entry.type-waypoint{border-left:3px solid var(--green);}
  .log-entry.type-system{border-left:3px solid var(--blue);}
  .log-entry-top{display:flex;justify-content:space-between;margin-bottom:3px;}
  .log-type{text-transform:uppercase;letter-spacing:1px;font-size:9px;}
  .log-type.intersection{color:var(--amber);}
  .log-type.waypoint{color:var(--green);}
  .log-type.system{color:var(--blue);}
  .log-time{color:var(--muted);font-size:9px;}
  .log-details{color:var(--text);line-height:1.5;}
  .log-coords{color:var(--muted);font-size:9px;margin-top:2px;}
  .empty-log{text-align:center;padding:32px;color:var(--muted);font-family:var(--mono);font-size:11px;}
  .export-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 20px;display:flex;gap:8px;z-index:100;}
  .export-bar .btn{flex:1;padding:11px;font-size:13px;}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--green);color:var(--green);font-family:var(--mono);font-size:12px;padding:10px 20px;border-radius:6px;z-index:2000;opacity:0;transition:opacity 0.3s;white-space:nowrap;}
  .toast.show{opacity:1;}
  .toast.error{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>

<div id="pwScreen">
  <div class="logo">CRUISEMATE</div>
  <div class="sub">FIELD TRACKER — PRIVATE</div>
  <input type="password" id="pwInput" placeholder="password" maxlength="20" onkeydown="if(event.key==='Enter')checkPw()">
  <button class="btn" id="pwBtn" onclick="checkPw()">ENTER</button>
  <div id="pwError">Incorrect password</div>
</div>

<div id="app">
<header>
  <div class="logo-sm">CRUISE<span>MATE</span> TRACKER</div>
  <div><span class="status-dot" id="gpsStatusDot"></span><span class="status-label" id="gpsStatusLabel">NO GPS</span></div>
</header>
<div class="coords-bar">
  LAT <span id="latDisplay">--</span>
  LNG <span id="lngDisplay">--</span>
  ACC <span id="accDisplay">--</span>m
  RDS <span id="roadDisplay">--</span>
</div>
<div class="speed-section">
  <div class="speed-ring">
    <svg viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="90"/>
      <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="90"/>
    </svg>
    <div class="speed-inner">
      <div class="speed-value" id="speedDisplay">0</div>
      <div class="speed-unit">km/h</div>
    </div>
  </div>
  <div class="intersection-badge" id="intersectionBadge">INTERSECTION DETECTED</div>
<div class="intersection-badge" id="congestionBadge" style="border-color:#ef4444;background:rgba(239,68,68,0.1);color:#ef4444;margin-top:6px;">CONGESTION DETECTED</div>
<div id="tripDebug" style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:1px;"></div>
<div id="tripStatusBanner" style="margin-top:10px;display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:50px;border:1px solid var(--muted);background:transparent;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);transition:all 0.3s;">
  <span id="tripStatusDot" style="width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;"></span>
  <span id="tripStatusText">STANDBY</span>
</div>
</div>
<div class="stats-row">
  <div class="stat-cell"><div class="stat-val" id="maxSpeed">0</div><div class="stat-lbl">Max km/h</div></div>
  <div class="stat-cell"><div class="stat-val" id="avgSpeed">0</div><div class="stat-lbl">Avg km/h</div></div>
  <div class="stat-cell"><div class="stat-val" id="distDisplay">0.0</div><div class="stat-lbl">km</div></div>
  <div class="stat-cell"><div class="stat-val" id="intCount">0</div><div class="stat-lbl">Intersections</div></div>
</div>
<div class="section">
  <div class="section-title">Trip</div>
  <div class="btn-row">
    <button class="btn btn-green" id="startTripBtn" onclick="startTrip()">START TRIP</button>
    <button class="btn btn-red" id="endTripBtn" onclick="endTrip()" disabled>END + SEND</button>
    <button class="btn btn-amber btn-full" id="stopTripBtn" onclick="stopTripNow()" disabled style="margin-top:0;">STOP TRIP NOW</button>
  </div>
</div>
<div class="section">
  <div class="section-title">Manual Log</div>
  <div class="note-row">
    <input class="note-input" id="waypointNote" placeholder="Note this location..." type="text">
    <button class="btn btn-green" onclick="logWaypoint()" style="padding:10px 16px;white-space:nowrap;">LOG</button>
  </div>
</div>
<div class="log-section">
  <div class="log-header">
    <div class="section-title" style="margin-bottom:0">Session Log</div>
    <div class="log-count" id="logCount">0 entries</div>
  </div>
  <div class="log-list" id="logList">
    <div class="empty-log">Tap START TRIP to begin logging.</div>
  </div>
</div>
<div class="export-bar">
  <button class="btn btn-blue" onclick="exportCSV()">EXPORT CSV</button>
  <button class="btn btn-green" onclick="sendNow()">SEND NOW</button>
  <button class="btn btn-muted" onclick="clearSession()">CLEAR</button>
</div>
<div class="toast" id="toast"></div>
</div>

<script>
const PASSWORD='cruisemate2026';
const EMAILJS_SERVICE='service_q8x643pq';
const EMAILJS_TEMPLATE='template_mtd34yi';
const EMAILJS_KEY='zbLk3roJpYTtc5Irb';
const SEND_TO='cruisemate.nsw@gmail.com';
const TRACK_INTERVAL=1000;
const OSM_INTERVAL=4000;
const INT_SPEED_MAX=15;
const INT_CONFIRM_SEC=4;
const INT_CLEAR_SPEED=20;
const OSM_RADIUS=35;
const ROAD_CHECK_INTERVAL=10000;   // road name capture every 10 seconds
let osmBusy=false;                  // queue lock — prevents simultaneous OSM calls
let roadCheckInterval=null;
let currentRoadName=null;
let currentSpeedLimit=null;
const AUTO_START_SPEED=5;        // km/h — above this for AUTO_START_SECS triggers start
const AUTO_START_SECS=3;         // seconds above threshold before auto-start
const AUTO_STOP_SPEED=3;         // km/h — below this starts stop timer
const AUTO_STOP_MINS=15;         // minutes stopped before auto-end
const MOVEMENT_METRES=5;         // kept for reference
const MOVEMENT_SECS=3;           // kept for reference

let watchId=null,currentPos=null,currentSpeed=0,maxSpeedVal=0,speedSamples=[],totalDistance=0,lastPos=null;
let autoStartTimer=null,autoStopTimer=null,movingStart=null,stoppedStart=null;
let departureDetected=false;    // true once we've moved 5m from last stopped position
let lastStationaryPos=null;     // GPS position when vehicle was last stationary
let redLightStops=[];
let approachBearings=[];        // last N bearings on approach to intersection
let exitBearings=[];            // first N bearings after leaving intersection
let lastBearing=null;           // most recent GPS bearing           // array of {start, end, durationMs, lat, lng, road}
let redLightStart=null;         // timestamp when speed hit 0
let tripStartTime=null;         // for free-flow calculation
let tripStartLat=null,tripStartLng=null;
let cumulativeStats={totalMins:0,redLightMins:0,intersectionMins:0,trips:0};
let sessionLog=[],tripActive=false,trackInterval=null,osmInterval=null;
let intersectionState='clear',intersectionEntry=null,intersectionSlowStart=null,intersectionCount=0;
let congestionState='clear';   // clear | congested
let congestionStart=null;        // when congestion began
let congestionStops=0;           // stop/creep count inside intersection
let lastSpeedForCongestion=0;    // track speed changes for stop/creep detection
let congestionLog=[];            // list of congestion events

function checkPw(){
  if(document.getElementById('pwInput').value===PASSWORD){
    document.getElementById('pwScreen').style.display='none';
    document.getElementById('app').style.display='block';
    emailjs.init(EMAILJS_KEY);
    loadFromStorage();
    loadCumulativeStats();
    startGPS();
    scheduleMidnight();
    renderLog();
    requestWakeLock();
  } else {
    document.getElementById('pwError').style.display='block';
    document.getElementById('pwInput').value='';
  }
}

function startGPS(){
  if(!navigator.geolocation){setStatus('error','NOT SUPPORTED');return;}
  setStatus('warning','ACQUIRING...');
  watchId=navigator.geolocation.watchPosition(onPosition,onError,{enableHighAccuracy:true,maximumAge:500,timeout:15000});
}

function onPosition(pos){
  setStatus('active','GPS LIVE');
  currentPos=pos;
  currentSpeed=Math.max(0,pos.coords.speed!==null?pos.coords.speed*3.6:0);
  const spd=Math.round(currentSpeed);
  document.getElementById('speedDisplay').textContent=spd;
  document.getElementById('latDisplay').textContent=pos.coords.latitude.toFixed(5);
  document.getElementById('lngDisplay').textContent=pos.coords.longitude.toFixed(5);
  document.getElementById('accDisplay').textContent=Math.round(pos.coords.accuracy);
  const pct=Math.min(currentSpeed/130,1);
  const ring=document.getElementById('ringFill');
  ring.style.strokeDashoffset=628-(pct*628);
  ring.style.stroke=currentSpeed>100?'#ef4444':currentSpeed>60?'#f59e0b':'#2ecc71';
  document.getElementById('speedDisplay').style.color=currentSpeed>100?'#ef4444':currentSpeed>60?'#f59e0b':'#2ecc71';
  if(tripActive){
    if(currentSpeed>maxSpeedVal){maxSpeedVal=currentSpeed;document.getElementById('maxSpeed').textContent=Math.round(maxSpeedVal);}
    speedSamples.push(currentSpeed);
    document.getElementById('avgSpeed').textContent=Math.round(speedSamples.reduce((a,b)=>a+b,0)/speedSamples.length);
    if(lastPos){totalDistance+=haversine(lastPos.coords.latitude,lastPos.coords.longitude,pos.coords.latitude,pos.coords.longitude);document.getElementById('distDisplay').textContent=totalDistance.toFixed(2);}
    lastPos=pos;
    trackRedLight();
    processIntersection();
  }
  // Always call checkAutoTrip — handles both auto-start and auto-stop
  checkAutoTrip();
}

function onError(e){const m={1:'PERMISSION DENIED',2:'UNAVAILABLE',3:'TIMEOUT'};setStatus('error',m[e.code]||'GPS ERROR');}
function setStatus(t,l){document.getElementById('gpsStatusDot').className='status-dot '+t;document.getElementById('gpsStatusLabel').textContent=l;}

function processIntersection(){
  const intBadge=document.getElementById('intersectionBadge');
  const congBadge=document.getElementById('congestionBadge');

  // Track stop/creep inside intersection for congestion detection
  if(intersectionState==='inside'){
    if(currentSpeed===0&&lastSpeedForCongestion>0) congestionStops++;
    lastSpeedForCongestion=currentSpeed;
  }

  if(currentSpeed<INT_SPEED_MAX){
    if(!intersectionSlowStart)intersectionSlowStart=Date.now();
    const slowSecs=(Date.now()-intersectionSlowStart)/1000;

    if(slowSecs>=INT_CONFIRM_SEC&&intersectionState==='clear'){
      intersectionState='approaching';
      intBadge.classList.add('visible');
      checkOSM();
    }

    // Congestion detection — slow on road for 20+ seconds, no intersection confirmed
    if(slowSecs>=20&&intersectionState==='clear'&&congestionState==='clear'){
      congestionState='congested';
      congestionStart=Date.now();
      congBadge.classList.add('visible');
    }

  } else if(currentSpeed>INT_CLEAR_SPEED){
    intersectionSlowStart=null;

    // ---- EXIT INTERSECTION ----
    intBadge.classList.remove('visible');
    if(intersectionState==='inside'&&intersectionEntry){
      const elapsed=Date.now()-intersectionEntry.startTime;

      // Determine intersection type based on dwell and stop/creep count
      let intType='FLOWING';
      if(elapsed>=15000&&elapsed<45000&&congestionStops<=1) intType='RED LIGHT';
      else if(elapsed>=45000&&elapsed<90000&&congestionStops<=1) intType='LONG CYCLE';
      else if(elapsed>=90000||congestionStops>1) intType='CONGESTED';
      else if(elapsed<15000) intType='FLOWING';

      const avgExitBearing=exitBearings.length>0?
        exitBearings.reduce((a,b)=>a+b,0)/exitBearings.length:null;
      const turnDir=calcTurnDirection(intersectionEntry.approachBearing,avgExitBearing);
      const turnLabel=turnDir?turnDir.label:'STRAIGHT';
      const turnArrow=turnDir?turnDir.arrow:'→';
      const approachName=intersectionEntry.approachRoad||'Unknown road';
      const exitName=currentRoadName||intersectionEntry.primaryRoad||'Unknown road';
      const displayLabel=approachName!==exitName?
        `${approachName} ${turnArrow} ${exitName}`:
        `${intersectionEntry.roads||'Intersection'}`;

      sessionLog.unshift({type:'intersection',time:new Date().toLocaleTimeString(),
        timestamp:new Date().toISOString(),
        label:displayLabel,
        intType,
        turnDirection:turnLabel,
        turnArrow,
        approachRoad:approachName,
        exitRoad:exitName,
        duration:formatTimer(elapsed),durationMs:elapsed,
        congestionStops,
        entrySpeed:intersectionEntry.speed,exitSpeed:Math.round(currentSpeed),
        lat:currentPos?currentPos.coords.latitude.toFixed(6):'--',
        lng:currentPos?currentPos.coords.longitude.toFixed(6):'--',
        accuracy:currentPos?Math.round(currentPos.coords.accuracy):'--',
        roads:intersectionEntry.roads,
        primaryRoad:intersectionEntry.primaryRoad,
        postedLimit:intersectionEntry.postedLimit});

      intersectionCount++;
      document.getElementById('intCount').textContent=intersectionCount;
      intersectionEntry=null;
      intersectionState='clear';
      congestionStops=0;
      lastSpeedForCongestion=0;
      saveToStorage();
      renderLog();

      // Toast with type
      const typeColors={'FLOWING':'green','RED LIGHT':'amber','LONG CYCLE':'amber','CONGESTED':'red'};
      showToast(`${intType}: ${displayLabel} — ${formatTimer(elapsed)}`);
    } else {
      intersectionState='clear';
    }

    // ---- CLEAR ROAD CONGESTION ----
    if(congestionState==='congested'&&congestionStart){
      const congDuration=Date.now()-congestionStart;
      if(congDuration>=20000){
        // Log congestion event
        congestionLog.push({
          type:'congestion',
          time:new Date().toLocaleTimeString(),
          timestamp:new Date().toISOString(),
          road:currentRoadName||'Unknown road',
          durationMs:congDuration,
          duration:formatTimer(congDuration),
          lat:currentPos?currentPos.coords.latitude.toFixed(6):'--',
          lng:currentPos?currentPos.coords.longitude.toFixed(6):'--'
        });
        sessionLog.unshift({type:'congestion',time:new Date().toLocaleTimeString(),
          timestamp:new Date().toISOString(),
          label:`Road congestion — ${currentRoadName||'Unknown road'}`,
          duration:formatTimer(congDuration),
          durationMs:congDuration,
          road:currentRoadName||'Unknown road',
          lat:currentPos?currentPos.coords.latitude.toFixed(6):'--',
          lng:currentPos?currentPos.coords.longitude.toFixed(6):'--'});
        renderLog();
        showToast(`Congestion: ${currentRoadName||'road'} — ${formatTimer(congDuration)}`);
      }
      congestionState='clear';
      congestionStart=null;
      congBadge.classList.remove('visible');
    }
  }
}

async function captureCurrentRoad(){
  if(!currentPos||!tripActive||osmBusy)return;
  // Don't query if already at an intersection
  if(intersectionState==='inside'||intersectionState==='approaching')return;
  osmBusy=true;
  const lat=currentPos.coords.latitude,lon=currentPos.coords.longitude;
  try{
    const d=20/111320; // 20m radius for road name
    const bbox=`${lat-d},${lon-d},${lat+d},${lon+d}`;
    const q=`[out:json][timeout:5];(way["highway"~"primary|secondary|tertiary|residential|trunk|motorway|unclassified"](${bbox}););out body;>;out skel qt;`;
    const r=await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`);
    const data=await r.json();
    const ways=(data.elements||[]).filter(e=>e.type==='way'&&e.tags);
    if(ways.length>0){
      // Pick the most prominent road (trunk > primary > secondary > tertiary > residential)
      const hierarchy=['motorway','trunk','primary','secondary','tertiary','unclassified','residential'];
      ways.sort((a,b)=>hierarchy.indexOf(a.tags.highway)-hierarchy.indexOf(b.tags.highway));
      const best=ways[0];
      currentRoadName=best.tags.name||best.tags.ref||best.tags.highway||null;
      currentSpeedLimit=best.tags.maxspeed?parseInt(best.tags.maxspeed):null;
      document.getElementById('roadDisplay').textContent=currentRoadName?currentRoadName.substring(0,15):'--';
    }
  }catch(e){
    // Silent fail — road name is enrichment, not critical
  }finally{
    osmBusy=false;
  }
}

async function checkOSM(){
  if(!currentPos)return;
  if(osmBusy)return; // wait for road check to finish
  osmBusy=true;
  const lat=currentPos.coords.latitude,lon=currentPos.coords.longitude;
  try{
    const d=OSM_RADIUS/111320;
    const bbox=`${lat-d},${lon-d},${lat+d},${lon+d}`;
    const q=`[out:json][timeout:5];(way["highway"](${bbox}););out body;>;out skel qt;`;
    const r=await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`);
    const data=await r.json();
    const ways=(data.elements||[]).filter(e=>e.type==='way');
    const names=[...new Set(ways.map(w=>w.tags?.name||w.tags?.ref||'').filter(Boolean))].slice(0,3);
    const roadStr=names.length>0?names.join(' / '):`${ways.length} roads`;
    const speedLimits=ways.map(w=>w.tags?.maxspeed).filter(Boolean);
    const postedLimit=speedLimits.length>0?parseInt(speedLimits[0]):null;
    const primaryRoad=names[0]||null;
    document.getElementById('roadDisplay').textContent=ways.length;
    if(ways.length>=2&&intersectionState==='approaching'){
      intersectionState='inside';
      const avgApproachBearing=approachBearings.length>0?
        Math.round(approachBearings.reduce((a,b)=>a+b,0)/approachBearings.length):null;
      intersectionEntry={startTime:Date.now(),speed:Math.round(currentSpeed),roads:roadStr,
        primaryRoad,postedLimit,lat:lat.toFixed(6),lng:lon.toFixed(6),
        approachBearing:avgApproachBearing,approachRoad:currentRoadName||null};
      exitBearings=[];
    }
  } catch(e){
    if(intersectionState==='approaching'){
      intersectionState='inside';
      intersectionEntry={startTime:Date.now(),speed:Math.round(currentSpeed),roads:'Unknown (OSM timeout)',lat:currentPos?currentPos.coords.latitude.toFixed(6):'--',lng:currentPos?currentPos.coords.longitude.toFixed(6):'--'};
    }
  }
}

function startTrip(){
  tripActive=true;maxSpeedVal=0;speedSamples=[];totalDistance=0;lastPos=null;
  redLightStops=[];redLightStart=null;
  tripStartTime=Date.now();
  tripStartLat=currentPos?currentPos.coords.latitude:null;
  tripStartLng=currentPos?currentPos.coords.longitude:null;
  intersectionCount=0;intersectionState='clear';intersectionEntry=null;intersectionSlowStart=null;
  document.getElementById('startTripBtn').disabled=true;
  document.getElementById('endTripBtn').disabled=false;
  document.getElementById('stopTripBtn').disabled=false;
  updateTripStatus('recording');
  ['maxSpeed','avgSpeed','intCount'].forEach(id=>document.getElementById(id).textContent='0');
  document.getElementById('distDisplay').textContent='0.0';
  addSystemLog('Trip started');
  trackInterval=setInterval(logTrack,TRACK_INTERVAL);
  roadCheckInterval=setInterval(captureCurrentRoad,ROAD_CHECK_INTERVAL);
  osmInterval=setInterval(()=>{if(tripActive&&currentSpeed<INT_SPEED_MAX&&intersectionState==='approaching')checkOSM();},OSM_INTERVAL);
  saveToStorage();showToast('Trip started');
}

function endTrip(){
  if(!tripActive)return;
  tripActive=false;
  clearInterval(trackInterval);clearInterval(osmInterval);clearInterval(roadCheckInterval);
  document.getElementById('startTripBtn').disabled=false;
  document.getElementById('endTripBtn').disabled=true;
  document.getElementById('stopTripBtn').disabled=true;
  document.getElementById('intersectionBadge').classList.remove('visible');
  updateTripStatus('standby');
  addSystemLog(`Trip ended — ${totalDistance.toFixed(2)} km — ${intersectionCount} intersections — max ${Math.round(maxSpeedVal)} km/h`);
  const currentSummary=saveTripToHistory();
  const history=loadTripHistory().slice(1); // exclude current trip
  window._lastSynthesis=synthesiseTrip(currentSummary,history);
  saveToStorage();renderLog();sendEmail();
}

function logTrack(){
  if(!currentPos||!tripActive)return;
  sessionLog.push({type:'track',time:new Date().toLocaleTimeString(),timestamp:new Date().toISOString(),speed:Math.round(currentSpeed),lat:currentPos.coords.latitude.toFixed(6),lng:currentPos.coords.longitude.toFixed(6),accuracy:Math.round(currentPos.coords.accuracy),distance:totalDistance.toFixed(3),road:currentRoadName||'',speedLimit:currentSpeedLimit||''});
  saveToStorage();
  document.getElementById('logCount').textContent=sessionLog.length+' entries';
}

function logWaypoint(){
  const note=document.getElementById('waypointNote').value||'Waypoint';
  sessionLog.unshift({type:'waypoint',time:new Date().toLocaleTimeString(),timestamp:new Date().toISOString(),label:note,speed:Math.round(currentSpeed),lat:currentPos?currentPos.coords.latitude.toFixed(6):'--',lng:currentPos?currentPos.coords.longitude.toFixed(6):'--',accuracy:currentPos?Math.round(currentPos.coords.accuracy):'--',distance:totalDistance.toFixed(3)});
  document.getElementById('waypointNote').value='';
  saveToStorage();renderLog();showToast('Waypoint logged');
}

function addSystemLog(msg){
  sessionLog.unshift({type:'system',time:new Date().toLocaleTimeString(),timestamp:new Date().toISOString(),label:msg});
  renderLog();
}



// ============================================================
// RED LIGHT DETECTION
// ============================================================
function trackRedLight(){
  if(currentSpeed===0){
    if(!redLightStart) redLightStart=Date.now();
  } else if(currentSpeed>3 && redLightStart){
    const elapsed=Date.now()-redLightStart;
    if(elapsed>=3000){ // only log if stopped 3+ seconds
      redLightStops.push({
        start:new Date(redLightStart).toISOString(),
        end:new Date().toISOString(),
        durationMs:elapsed,
        lat:currentPos?currentPos.coords.latitude.toFixed(6):'--',
        lng:currentPos?currentPos.coords.longitude.toFixed(6):'--',
        road:currentRoadName||'Unknown'
      });
    }
    redLightStart=null;
  }
}

// TRIP STATUS BANNER
// ============================================================
function updateTripStatus(state, extra){
  const banner=document.getElementById('tripStatusBanner');
  const dot=document.getElementById('tripStatusDot');
  const text=document.getElementById('tripStatusText');
  if(state==='standby'){
    banner.style.borderColor='var(--muted)';
    banner.style.background='transparent';
    dot.style.background='var(--muted)';
    dot.style.boxShadow='none';
    dot.style.animation='none';
    text.textContent='STANDBY';
    text.style.color='var(--muted)';
  } else if(state==='recording'){
    banner.style.borderColor='var(--green)';
    banner.style.background='var(--green-glow)';
    dot.style.background='var(--green)';
    dot.style.boxShadow='0 0 8px var(--green)';
    dot.style.animation='blink 1.5s ease-in-out infinite';
    text.textContent='RECORDING';
    text.style.color='var(--green)';
  } else if(state==='stopped'){
    banner.style.borderColor='var(--amber)';
    banner.style.background='rgba(245,158,11,0.1)';
    dot.style.background='var(--amber)';
    dot.style.boxShadow='0 0 8px var(--amber)';
    dot.style.animation='blink 1.5s ease-in-out infinite';
    text.textContent=extra||'STOPPED';
    text.style.color='var(--amber)';
  }
}

// Stop trip immediately without waiting 15 mins — sends email, doesn't disable auto-start
function stopTripNow(){
  if(!tripActive)return;
  addSystemLog('Trip stopped manually');
  endTrip();
  showToast('Trip stopped — auto-start still active');
}

function checkAutoTrip(){
  if(!currentPos) return;

  // Debug display
  const dbg=document.getElementById('tripDebug');
  if(dbg) dbg.textContent=`spd:${Math.round(currentSpeed)} km/h | moving:${movingStart?Math.round((Date.now()-movingStart)/1000)+'s':'--'} | trip:${tripActive?'ON':'OFF'}`;

  // ---- AUTO-START: simple speed threshold ----
  if(!tripActive){
    if(currentSpeed>=AUTO_START_SPEED){
      if(!movingStart) movingStart=Date.now();
      const movingSecs=(Date.now()-movingStart)/1000;
      const secsLeft=Math.max(0,AUTO_START_SECS-movingSecs);
      updateTripStatus('standby');
      if(dbg) dbg.textContent=`spd:${Math.round(currentSpeed)} km/h | starting in ${secsLeft.toFixed(1)}s`;
      if(movingSecs>=AUTO_START_SECS){
        movingStart=null;
        startTrip();
        showToast('Trip auto-started');
      }
    } else {
      movingStart=null;
      updateTripStatus('standby');
    }
    return;
  }

  // ---- AUTO-STOP: speed-based (trip is active) ----
  if(currentSpeed<AUTO_STOP_SPEED){
    movingStart=null;
    if(!stoppedStart) stoppedStart=Date.now();
    const stoppedMins=(Date.now()-stoppedStart)/1000/60;
    const minsLeft=Math.max(0,AUTO_STOP_MINS-stoppedMins);
    if(stoppedMins>0.5){
      updateTripStatus('stopped',`STOPPED ${Math.floor(stoppedMins)}m — ends in ${Math.ceil(minsLeft)}m`);
      setStatus('warning',`STOPPED ${Math.floor(stoppedMins)}m`);
    } else {
      updateTripStatus('recording');
    }
    if(stoppedMins>=AUTO_STOP_MINS){
      stoppedStart=null;
      addSystemLog('Auto-ended: stopped 15+ minutes');
      endTrip();
      showToast('Trip auto-ended — will restart when moving');
    }
  } else {
    stoppedStart=null;
    updateTripStatus('recording');
    setStatus('active','GPS LIVE');
  }
}

function getTimeOfDayLabel(){
  const h=new Date().getHours(),m=new Date().getMinutes(),t=h*60+m;
  if(t>=420&&t<=540) return 'Morning Peak (7-9am)';
  if(t>=480&&t<=570) return 'School Run AM (8-9:30am)';
  if(t>=870&&t<=930) return 'School Run PM (2:30-3:30pm)';
  if(t>=900&&t<=1080) return 'Afternoon Peak (3-6pm)';
  if(t>=360&&t<420) return 'Early Morning';
  if(t>=1080) return 'Evening';
  return 'Off-Peak';
}

function getDayType(){
  const d=new Date().getDay();
  return(d===0||d===6)?'Weekend':'Weekday';
}

// ============================================================
// TRIP HISTORY — stores summaries only (not raw GPS)
// ============================================================
function saveTripToHistory(){
  const ints=sessionLog.filter(e=>e.type==='intersection');
  const trks=sessionLog.filter(e=>e.type==='track');
  const avg=speedSamples.length?Math.round(speedSamples.reduce((a,b)=>a+b,0)/speedSamples.length):0;

  // Build corridor speed analysis from track points
  const trackPoints=sessionLog.filter(e=>e.type==='track'&&e.road);
  const corridorMap={};
  trackPoints.forEach(t=>{
    if(!t.road)return;
    if(!corridorMap[t.road])corridorMap[t.road]={speeds:[],speedLimit:t.speedLimit||null,road:t.road};
    corridorMap[t.road].speeds.push(t.speed);
    if(t.speedLimit&&!corridorMap[t.road].speedLimit)corridorMap[t.road].speedLimit=t.speedLimit;
  });
  const corridorStats=Object.values(corridorMap).map(c=>({
    road:c.road,
    avgSpeed:Math.round(c.speeds.reduce((a,b)=>a+b,0)/c.speeds.length),
    maxSpeed:Math.round(Math.max(...c.speeds)),
    minSpeed:Math.round(Math.min(...c.speeds)),
    samples:c.speeds.length,
    speedLimit:c.speedLimit,
    pctOfLimit:c.speedLimit?Math.round((c.speeds.reduce((a,b)=>a+b,0)/c.speeds.length/c.speedLimit)*100):null
  })).filter(c=>c.samples>=3).sort((a,b)=>a.avgSpeed-b.avgSpeed);

  const corridors=[...new Set(ints.map(e=>e.primaryRoad||e.roads).filter(Boolean))];

  // Build intersection summaries
  const intSummaries=ints.map(e=>({
    roads:e.roads,
    primaryRoad:e.primaryRoad||null,
    approachRoad:e.approachRoad||null,
    exitRoad:e.exitRoad||null,
    turnDirection:e.turnDirection||null,
    turnArrow:e.turnArrow||null,
    postedLimit:e.postedLimit||null,
    durationMs:e.durationMs,
    entrySpeed:e.entrySpeed,
    exitSpeed:e.exitSpeed,
    lat:e.lat,
    lng:e.lng
  }));

  // Free-flow calculation
  const tripDurationMins=tripStartTime?(Date.now()-tripStartTime)/1000/60:0;
  const dominantLimit=corridorStats.length>0&&corridorStats[0].speedLimit?
    corridorStats.sort((a,b)=>b.samples-a.samples)[0].speedLimit:50;
  const freeFlowMins=totalDistance>0?(totalDistance/dominantLimit)*60:0;
  const timeLostMins=Math.max(0,tripDurationMins-freeFlowMins);
  const congestionPct=tripDurationMins>0?Math.round((timeLostMins/tripDurationMins)*100):0;

  // Red light stats
  const totalRedLightMs=redLightStops.reduce((a,b)=>a+b.durationMs,0);
  const totalRedLightMins=totalRedLightMs/1000/60;
  const avgRedLightSec=redLightStops.length>0?Math.round(totalRedLightMs/redLightStops.length/1000):0;

  // Intersection total time
  const totalIntMs=ints.reduce((a,b)=>a+(b.durationMs||0),0);
  const totalIntMins=totalIntMs/1000/60;

  // Trip purpose inference
  const h=new Date().getHours(),m=new Date().getMinutes(),t=h*60+m;
  const dow=new Date().getDay();
  const nearSchool=ints.some(e=>e.roads&&e.roads.toLowerCase().includes('school'));
  let inferredPurpose='CruiseMate field testing';
  if(dow===0||dow===6) inferredPurpose='CruiseMate field testing — weekend validation';
  else if(t>=420&&t<=570&&nearSchool) inferredPurpose='CruiseMate field testing — school zone AM observation';
  else if(t>=870&&t<=960&&nearSchool) inferredPurpose='CruiseMate field testing — school zone PM observation';
  else if(t>=420&&t<=540) inferredPurpose='CruiseMate field testing — morning peak corridor validation';
  else if(t>=900&&t<=1080) inferredPurpose='CruiseMate field testing — afternoon peak corridor validation';
  else if(totalDistance>30&&avg>50) inferredPurpose='CruiseMate field testing — highway corridor validation';
  else if(ints.length>8&&avg<25) inferredPurpose='CruiseMate field testing — urban congestion validation';
  else if(t>=360&&t<420) inferredPurpose='CruiseMate field testing — early morning baseline';
  else if(t>=1080) inferredPurpose='CruiseMate field testing — evening corridor validation';

  // Update cumulative stats
  cumulativeStats.totalMins+=tripDurationMins;
  cumulativeStats.redLightMins+=totalRedLightMins;
  cumulativeStats.intersectionMins+=totalIntMins;
  cumulativeStats.trips+=1;
  saveCumulativeStats();

  const summary={
    date:new Date().toISOString(),
    dateLabel:new Date().toLocaleDateString('en-AU').replace(/\//g,'-'),
    timeOfDay:getTimeOfDayLabel(),
    dayType:getDayType(),
    inferredPurpose,
    distanceKm:parseFloat(totalDistance.toFixed(2)),
    durationMins:parseFloat(tripDurationMins.toFixed(1)),
    maxSpeed:Math.round(maxSpeedVal),
    avgSpeed:avg,
    freeFlowMins:parseFloat(freeFlowMins.toFixed(1)),
    timeLostMins:parseFloat(timeLostMins.toFixed(1)),
    congestionPct,
    redLightCount:redLightStops.length,
    redLightTotalMins:parseFloat(totalRedLightMins.toFixed(1)),
    avgRedLightSec,
    intersectionCount:ints.length,
    intersectionTotalMins:parseFloat(totalIntMins.toFixed(1)),
    trackPoints:trks.length,
    corridors,
    corridorStats,
    intersections:intSummaries,
    redLights:redLightStops.slice(0,20)
  };

  try{
    let history=JSON.parse(localStorage.getItem('cm_history')||'[]');
    history.unshift(summary);
    // Keep last 90 days
    const cutoff=Date.now()-(90*24*60*60*1000);
    history=history.filter(t=>new Date(t.date).getTime()>cutoff);
    // Cap at 200 trips
    if(history.length>200)history=history.slice(0,200);
    localStorage.setItem('cm_history',JSON.stringify(history));
  }catch(e){}

  return summary;
}

function loadTripHistory(){
  try{return JSON.parse(localStorage.getItem('cm_history')||'[]');}
  catch(e){return[];}
}

// ============================================================
// RULE-BASED SYNTHESIS ENGINE
// ============================================================

// ============================================================
// BEARING & TURN DIRECTION
// ============================================================
function calcBearing(lat1,lon1,lat2,lon2){
  const dLat=lat2-lat1,dLon=lon2-lon1;
  if(Math.abs(dLat)<0.000005&&Math.abs(dLon)<0.000005)return null; // not moving
  const rad=Math.atan2(dLon,dLat)*180/Math.PI;
  return(rad+360)%360;
}

function calcTurnDirection(approachBearing,exitBearing){
  if(approachBearing===null||exitBearing===null)return null;
  let diff=(exitBearing-approachBearing+360)%360;
  if(diff>180)diff=diff-360; // normalise to -180 to 180
  if(Math.abs(diff)<=25) return{label:'STRAIGHT',arrow:'→'};
  if(diff>25&&diff<=135) return{label:'RIGHT TURN',arrow:'↱'};
  if(diff>135) return{label:'U-TURN',arrow:'↩'};
  if(diff<-25&&diff>=-135) return{label:'LEFT TURN',arrow:'↲'};
  if(diff<-135) return{label:'U-TURN',arrow:'↩'};
  return{label:'STRAIGHT',arrow:'→'};
}

function synthesiseTrip(currentSummary,history){
  const statements=[];
  const MIN_TRIPS_FOR_COMPARISON=5;

  // Filter history to same time of day and day type for fair comparison
  const comparable=history.filter(t=>
    t.timeOfDay===currentSummary.timeOfDay&&
    t.dayType===currentSummary.dayType&&
    t.date!==currentSummary.date
  );

  // --- STATEMENT 0: Free-flow time lost ---
  if(currentSummary.timeLostMins>0&&currentSummary.distanceKm>2){
    const tl=currentSummary.timeLostMins.toFixed(1);
    const ff=currentSummary.freeFlowMins.toFixed(1);
    const act=currentSummary.durationMins.toFixed(1);
    const pct=currentSummary.congestionPct;
    const weeklyLost=(currentSummary.timeLostMins*5).toFixed(0);
    const annualHours=((currentSummary.timeLostMins*5*48)/60).toFixed(1);
    statements.push(`FREE-FLOW: This ${currentSummary.distanceKm} km trip took ${act} minutes. At posted speed limits with no stops it should take ${ff} minutes. Congestion cost you ${tl} minutes — ${pct}% of total travel time. Driving this route 5 days a week costs ${weeklyLost} minutes per week or ${annualHours} hours per year to congestion alone.`);
  }

  // --- STATEMENT 0b: Red light analysis ---
  if(currentSummary.redLightCount>0){
    const rlMins=currentSummary.redLightTotalMins.toFixed(1);
    const rlSec=currentSummary.avgRedLightSec;
    const weeklyRL=(currentSummary.redLightTotalMins*5).toFixed(0);
    statements.push(`RED LIGHTS: ${currentSummary.redLightCount} complete stops at red lights this trip. Average wait ${rlSec} seconds. Total time stopped at lights: ${rlMins} minutes. On a 5-day commute that is ${weeklyRL} minutes per week sitting at red lights.`);
  }

  // --- STATEMENT 0c: Cumulative lifetime cost ---
  if(cumulativeStats.trips>=3){
    const totalHours=(cumulativeStats.totalMins/60).toFixed(1);
    const rlHours=(cumulativeStats.redLightMins/60).toFixed(1);
    const intHours=(cumulativeStats.intersectionMins/60).toFixed(1);
    const annualProjection=cumulativeStats.trips>4?(((cumulativeStats.totalMins/cumulativeStats.trips)*250)/60).toFixed(0):null;
    let cumStmt=`CUMULATIVE (${cumulativeStats.trips} trips): Total time in the car: ${totalHours} hours. Time at red lights: ${rlHours} hours. Time at intersections: ${intHours} hours.`;
    if(annualProjection)cumStmt+=` At your current rate, projected annual driving time is ${annualProjection} hours.`;
    statements.push(cumStmt);
  }

  // --- STATEMENT 1: Intersection performance ---
  if(currentSummary.intersections.length>0){
    const avgDwellMs=currentSummary.intersections.reduce((a,b)=>a+b.durationMs,0)/currentSummary.intersections.length;
    const avgDwellSec=Math.round(avgDwellMs/1000);
    const totalDwellSec=Math.round(currentSummary.intersections.reduce((a,b)=>a+b.durationMs,0)/1000);

    // Compare to history if enough data
    if(comparable.length>=MIN_TRIPS_FOR_COMPARISON){
      const historicalInts=comparable.flatMap(t=>t.intersections);
      if(historicalInts.length>0){
        const historicalAvgMs=historicalInts.reduce((a,b)=>a+b.durationMs,0)/historicalInts.length;
        const historicalAvgSec=Math.round(historicalAvgMs/1000);
        const pctChange=Math.round(((avgDwellMs-historicalAvgMs)/historicalAvgMs)*100);
        const direction=pctChange>0?'slower':'faster';
        const absPct=Math.abs(pctChange);

        if(absPct>=10){
          const weeklyExtraSec=Math.abs(avgDwellSec-historicalAvgSec)*currentSummary.intersections.length*5;
          const weeklyExtraMins=Math.round(weeklyExtraSec/60);
          statements.push(`TREND: Intersections on this route are ${absPct}% ${direction} than your ${comparable.length}-trip average. Average dwell time is now ${avgDwellSec}s vs ${historicalAvgSec}s historical. If you drive this route 5 days a week, that adds ${weeklyExtraMins} minutes per week.`);
        } else {
          statements.push(`TREND: Intersection times are consistent with your historical average (${avgDwellSec}s vs ${historicalAvgSec}s baseline across ${comparable.length} comparable trips).`);
        }
      }
    } else {
      statements.push(`BASELINE: ${currentSummary.intersections.length} intersection${currentSummary.intersections.length>1?'s':''} logged, averaging ${avgDwellSec}s dwell time. Total time at intersections this trip: ${totalDwellSec}s. Building baseline — comparisons available after ${MIN_TRIPS_FOR_COMPARISON} trips on this route.`);
    }
  }

  // --- STATEMENT 2: Speed vs posted limit ---
  const intsWithLimit=currentSummary.intersections.filter(e=>e.postedLimit);
  if(intsWithLimit.length>0&&currentSummary.avgSpeed>0){
    const limits=intsWithLimit.map(e=>e.postedLimit);
    const commonLimit=limits.sort((a,b)=>limits.filter(v=>v===b).length-limits.filter(v=>v===a).length)[0];
    const speedRatio=Math.round((currentSummary.avgSpeed/commonLimit)*100);
    if(speedRatio<70){
      const deficit=commonLimit-currentSummary.avgSpeed;
      statements.push(`SPEED: Average speed was ${currentSummary.avgSpeed} km/h against a ${commonLimit} km/h posted limit — travelling at ${speedRatio}% of the speed limit. ${deficit} km/h below posted limit on average suggests significant congestion or repeated stopping on this corridor.`);
    } else if(speedRatio>=70&&speedRatio<90){
      statements.push(`SPEED: Average speed was ${currentSummary.avgSpeed} km/h against a ${commonLimit} km/h posted limit — ${100-speedRatio}% below the limit. Moderate congestion on this corridor.`);
    } else {
      statements.push(`SPEED: Average speed ${currentSummary.avgSpeed} km/h — travelling at ${speedRatio}% of the ${commonLimit} km/h posted limit. Route flowing well.`);
    }
  } else {
    // No posted limit data — use absolute speed observation
    if(currentSummary.avgSpeed>0&&currentSummary.avgSpeed<25){
      statements.push(`SPEED: Average speed was only ${currentSummary.avgSpeed} km/h — consistent with heavy congestion or frequent stopping on this route.`);
    } else if(currentSummary.avgSpeed>=25&&currentSummary.avgSpeed<45){
      statements.push(`SPEED: Average speed ${currentSummary.avgSpeed} km/h — moderate flow. Intersections and traffic signals impacting throughput.`);
    } else if(currentSummary.avgSpeed>0){
      statements.push(`SPEED: Average speed ${currentSummary.avgSpeed} km/h — good flow on this route.`);
    }
  }

  // --- STATEMENT 3: Persona-specific impact ---
  const totalTripMins=currentSummary.distanceKm>0?Math.round((currentSummary.distanceKm/Math.max(currentSummary.avgSpeed,1))*60):0;
  const totalDwellMins=currentSummary.intersections.length>0?Math.round(currentSummary.intersections.reduce((a,b)=>a+b.durationMs,0)/1000/60):0;
  const dwellPct=totalTripMins>0?Math.round((totalDwellMins/totalTripMins)*100):0;

  if(currentSummary.intersections.length>0&&totalDwellMins>0){
    const weeklyMins=totalDwellMins*5;
    const termMins=weeklyMins*10;
    const termHours=(termHours=>termHours<1?`${termMins} minutes`:`${Math.round(termMins/60)} hour${Math.round(termMins/60)>1?'s':''}`)(termMins/60);

    if(dwellPct>=30){
      statements.push(`IMPACT: ${dwellPct}% of this trip was spent stationary at intersections (${totalDwellMins} min${totalDwellMins>1?'s':''}). For a parent doing school pickups 5 days a week, that is ${weeklyMins} minutes per week or ${termHours} per school term sitting at lights and intersections on this route.`);
    } else {
      statements.push(`IMPACT: ${totalDwellMins} minute${totalDwellMins>1?'s':''} spent at intersections this trip (${dwellPct}% of travel time). For a tradie running this route daily, intersection delays add ${weeklyMins} minutes per week — time that could be a billable job.`);
    }
  }

  // --- STATEMENT 4: Slowest intersection + turn analysis ---
  if(currentSummary.intersections.length>0){
    const withTurn=currentSummary.intersections.filter(e=>e.turnDirection&&e.turnDirection!=='STRAIGHT');
    const rightTurns=withTurn.filter(e=>e.turnDirection==='RIGHT TURN');
    const leftTurns=withTurn.filter(e=>e.turnDirection==='LEFT TURN');
    const slowest=currentSummary.intersections.reduce((a,b)=>a.durationMs>b.durationMs?a:b);
    const slowestSec=Math.round(slowest.durationMs/1000);
    
    if(slowestSec>=20){
      const turnNote=slowest.turnDirection&&slowest.turnDirection!=='STRAIGHT'?
        ` (${slowest.turnDirection.toLowerCase()})`:'';
      statements.push(`WORST POINT: Slowest intersection was ${slowest.approachRoad||slowest.roads} ${slowest.turnArrow||'→'} ${slowest.exitRoad||''} at ${slowestSec} seconds${turnNote}. Entry ${slowest.entrySpeed} km/h, exit ${slowest.exitSpeed} km/h. ${slowestSec>=45?'This exceeds a standard traffic light cycle — likely a protected turn or long red phase.':''}`);
    }

    if(rightTurns.length>0){
      const avgRightSec=Math.round(rightTurns.reduce((a,b)=>a+b.durationMs,0)/rightTurns.length/1000);
      statements.push(`RIGHT TURNS: ${rightTurns.length} right turn${rightTurns.length>1?'s':''} this trip averaging ${avgRightSec} seconds. ${avgRightSec>=45?'Right turns averaging 45+ seconds typically indicate unprotected right turn phases — consider alternate route or timing.':'Right turn waits within normal range.'}`);
    }

    if(leftTurns.length>0){
      const avgLeftSec=Math.round(leftTurns.reduce((a,b)=>a+b.durationMs,0)/leftTurns.length/1000);
      statements.push(`LEFT TURNS: ${leftTurns.length} left turn${leftTurns.length>1?'s':''} averaging ${avgLeftSec} seconds. ${avgLeftSec>=30?'Left turns averaging 30+ seconds is unusual and may indicate pedestrian crossing phases on this movement.':''}`);
    }
  }

  // --- STATEMENT 4b: Corridor speed analysis ---
  if(currentSummary.corridorStats&&currentSummary.corridorStats.length>0){
    const slowest=currentSummary.corridorStats[0];
    const fastest=currentSummary.corridorStats[currentSummary.corridorStats.length-1];
    
    if(slowest.pctOfLimit!==null&&slowest.pctOfLimit<70){
      const deficit=slowest.speedLimit-slowest.avgSpeed;
      statements.push(`CORRIDOR: ${slowest.road} was your slowest corridor at ${slowest.avgSpeed} km/h average — ${slowest.pctOfLimit}% of the ${slowest.speedLimit} km/h posted limit. ${deficit} km/h below the limit on average. Over a 5-day week this corridor adds significant delay to your route.`);
    } else if(slowest.avgSpeed<30){
      statements.push(`CORRIDOR: ${slowest.road} was your slowest corridor at ${slowest.avgSpeed} km/h average across ${slowest.samples} track points. Heavy congestion or repeated stopping on this road.`);
    }

    if(currentSummary.corridorStats.length>1&&fastest.road!==slowest.road){
      statements.push(`CORRIDOR CONTRAST: ${fastest.road} flowed at ${fastest.avgSpeed} km/h${fastest.pctOfLimit?` (${fastest.pctOfLimit}% of limit)`:''} vs ${slowest.road} at ${slowest.avgSpeed} km/h — a ${fastest.avgSpeed-slowest.avgSpeed} km/h difference between your fastest and slowest corridors this trip.`);
    }
  }

  // --- STATEMENT 4c: Congestion events ---
  const congEvents=sessionLog?sessionLog.filter(e=>e.type==='congestion'):[];
  if(congEvents.length>0){
    const totalCongMs=congEvents.reduce((a,b)=>a+(b.durationMs||0),0);
    const totalCongMins=(totalCongMs/1000/60).toFixed(1);
    const congRoads=[...new Set(congEvents.map(e=>e.road).filter(Boolean))].join(', ');
    statements.push(`ROAD CONGESTION: ${congEvents.length} congestion event${congEvents.length>1?'s':''} detected totalling ${totalCongMins} minutes on ${congRoads||'your route'}. This is separate from intersection delays — likely signal overflow, incidents, or high demand on these corridors.`);
  }

  // --- STATEMENT 4d: Intersection type breakdown ---
  if(currentSummary.intersections.length>0){
    const byType={FLOWING:0,'RED LIGHT':0,'LONG CYCLE':0,CONGESTED:0};
    currentSummary.intersections.forEach(i=>{ if(byType[i.intType]!==undefined)byType[i.intType]++; });
    const parts=Object.entries(byType).filter(([t,n])=>n>0).map(([t,n])=>`${n} ${t.toLowerCase()}`).join(', ');
    if(parts) statements.push(`INTERSECTION BREAKDOWN: ${parts}. ${byType.CONGESTED>0?`${byType.CONGESTED} congested intersection${byType.CONGESTED>1?'s':''} detected — stop/creep cycling or dwell over 90 seconds.`:''}`);
  }

  // --- STATEMENT 5: Route trend over all history ---
  if(history.length>=MIN_TRIPS_FOR_COMPARISON){
    const recentTrips=history.slice(0,5);
    const olderTrips=history.slice(-5);
    const recentAvgSpeed=recentTrips.reduce((a,b)=>a+b.avgSpeed,0)/recentTrips.length;
    const olderAvgSpeed=olderTrips.reduce((a,b)=>a+b.avgSpeed,0)/olderTrips.length;
    if(olderAvgSpeed>0){
      const trendPct=Math.round(((recentAvgSpeed-olderAvgSpeed)/olderAvgSpeed)*100);
      if(Math.abs(trendPct)>=5){
        const dir=trendPct>0?'faster':'slower';
        statements.push(`LONG-TERM TREND: Average speed across your last 5 trips is ${Math.abs(trendPct)}% ${dir} than your earliest ${Math.min(history.length,5)} recorded trips (${Math.round(recentAvgSpeed)} km/h vs ${Math.round(olderAvgSpeed)} km/h). ${trendPct<0?'Road conditions on your regular routes are degrading over time.':'Route conditions have improved.'}`);
      }
    }
  }

  return statements;
}


function sendNow(){
  if(sessionLog.length===0){showToast('No data to send yet',true);return;}
  showToast('Sending current session data...');
  const ints=sessionLog.filter(e=>e.type==='intersection');
  const wps=sessionLog.filter(e=>e.type==='waypoint');
  const trks=sessionLog.filter(e=>e.type==='track');
  const avg=speedSamples.length?Math.round(speedSamples.reduce((a,b)=>a+b,0)/speedSamples.length):0;
  const tripDate=new Date().toLocaleDateString('en-AU').replace(/\//g,'-');
  const intLines=ints.map(e=>`  ${e.time} | ${e.approachRoad||''} ${e.turnArrow||''} ${e.exitRoad||e.label} | ${e.duration} | in ${e.entrySpeed} out ${e.exitSpeed} km/h`).join('\n')||'  None';
  const wpLines=wps.map(e=>`  ${e.time} | ${e.label} | ${e.speed} km/h`).join('\n')||'  None';
  // Build live corridor data from current session tracks
  const currentTracks=sessionLog.filter(e=>e.type==='track'&&e.road);
  const liveCorridorMap={};
  currentTracks.forEach(t=>{
    if(!t.road)return;
    if(!liveCorridorMap[t.road])liveCorridorMap[t.road]={speeds:[],limit:t.speedLimit||null};
    liveCorridorMap[t.road].speeds.push(t.speed);
    if(t.speedLimit&&!liveCorridorMap[t.road].limit)liveCorridorMap[t.road].limit=t.speedLimit;
  });
  const liveCorridors=Object.entries(liveCorridorMap)
    .filter(([r,d])=>d.speeds.length>=3)
    .map(([r,d])=>{
      const avg=Math.round(d.speeds.reduce((a,b)=>a+b,0)/d.speeds.length);
      const pct=d.limit?Math.round((avg/d.limit)*100):null;
      return`  ${r} | avg ${avg} km/h${d.limit?` | limit ${d.limit} km/h | ${pct}% of limit`:''} | ${d.speeds.length} samples`;
    });
  const corridorLines=liveCorridors.length>0?liveCorridors.join('\n'):'  No corridor data yet — road names capture every 10 seconds while moving';

  const synthesis=window._lastSynthesis||[];

  const summary=`ON-DEMAND REPORT — ${new Date().toLocaleTimeString()}
--------------------------
Date:           ${tripDate}
Time of day:    ${getTimeOfDayLabel()} | ${getDayType()}
Purpose:        ${lastTripData.inferredPurpose||'CruiseMate field testing'}
Distance:       ${totalDistance.toFixed(2)} km
Max speed:      ${Math.round(maxSpeedVal)} km/h
Avg speed:      ${avg} km/h
Red light stops:${lastTripData.redLightCount||0} stops | avg ${lastTripData.avgRedLightSec||0}s
Intersections:  ${ints.length}
Waypoints:      ${wps.length}
Track points:   ${trks.length}
Trip active:    ${tripActive?'YES — still recording':'NO'}

CORRIDORS
--------------------------
${corridorLines}

INTERSECTIONS
--------------------------
${intLines}

WAYPOINTS
--------------------------
${wpLines}

DATA INSIGHTS
--------------------------
${synthesisLines}

CUMULATIVE TO DATE
--------------------------
Total trips:    ${cumulativeStats.trips}
Total drive:    ${(cumulativeStats.totalMins/60).toFixed(1)} hours
Red light time: ${(cumulativeStats.redLightMins/60).toFixed(1)} hours

--------------------------
NOTE: Trip still active — auto-send at 11:59pm will include complete data.`;

  emailjs.send(EMAILJS_SERVICE,EMAILJS_TEMPLATE,{
    to_email:SEND_TO,
    trip_date:tripDate+' (on-demand)',
    entry_count:sessionLog.length,
    summary:summary,
    csv_data:''
  }).then(()=>showToast('Session data sent to '+SEND_TO))

}

function buildCSV(){
  const h=['Type','Timestamp','Label','Duration','Entry_Speed','Exit_Speed','Speed_kmh','Lat','Lng','Accuracy_m','Distance_km','Roads'];
  const r=sessionLog.map(e=>[e.type,e.timestamp,`"${e.label||''}"`,e.duration||'',e.entrySpeed||'',e.exitSpeed||'',e.speed||'',e.lat||'',e.lng||'',e.accuracy||'',e.distance||'',`"${e.roads||''}"`].join(','));
  return[h.join(','),...r].join('\n');
}

function scheduleMidnight(){
  const now=new Date(),m=new Date();
  m.setHours(23,59,0,0);
  if(now>m)m.setDate(m.getDate()+1);
  setTimeout(()=>{if(sessionLog.length>0){addSystemLog('Auto-send: end of day');sendEmail();}scheduleMidnight();},(m-now));
}


// ============================================================
// CUMULATIVE STATS
// ============================================================
function saveCumulativeStats(){
  try{localStorage.setItem('cm_cumulative',JSON.stringify(cumulativeStats));}catch(e){}
}

function loadCumulativeStats(){
  try{
    const s=localStorage.getItem('cm_cumulative');
    if(s)cumulativeStats=JSON.parse(s);
  }catch(e){}
}

function saveToStorage(){
  try{localStorage.setItem('cm_log',JSON.stringify(sessionLog));localStorage.setItem('cm_stats',JSON.stringify({maxSpeedVal,totalDistance,intersectionCount,speedSamples}));}catch(e){}
}

function loadFromStorage(){
  try{
    const l=localStorage.getItem('cm_log');if(l)sessionLog=JSON.parse(l);
    const s=localStorage.getItem('cm_stats');
    if(s){const d=JSON.parse(s);maxSpeedVal=d.maxSpeedVal||0;totalDistance=d.totalDistance||0;intersectionCount=d.intersectionCount||0;speedSamples=d.speedSamples||[];
      document.getElementById('maxSpeed').textContent=Math.round(maxSpeedVal);
      document.getElementById('distDisplay').textContent=totalDistance.toFixed(2);
      document.getElementById('intCount').textContent=intersectionCount;
      if(speedSamples.length)document.getElementById('avgSpeed').textContent=Math.round(speedSamples.reduce((a,b)=>a+b,0)/speedSamples.length);
    }
  }catch(e){}
}

function exportCSV(){
  if(!sessionLog.length){showToast('No entries yet',true);return;}
  const csv=buildCSV();
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`cruisemate-field-${new Date().toISOString().split('T')[0]}.csv`;a.click();URL.revokeObjectURL(url);
  showToast('CSV exported');
}

function clearSession(){
  if(!confirm('Clear all session data?'))return;
  sessionLog=[];maxSpeedVal=0;speedSamples=[];totalDistance=0;lastPos=null;intersectionCount=0;
  localStorage.removeItem('cm_log');localStorage.removeItem('cm_stats');
  ['maxSpeed','avgSpeed','intCount'].forEach(id=>document.getElementById(id).textContent='0');
  document.getElementById('distDisplay').textContent='0.0';
  document.getElementById('speedDisplay').textContent='0';
  renderLog();showToast('Session cleared');
}

function renderLog(){
  const list=document.getElementById('logList');
  const visible=sessionLog.filter(e=>e.type!=='track');
  document.getElementById('logCount').textContent=sessionLog.length+' entries';
  if(!sessionLog.length){list.innerHTML='<div class="empty-log">Tap START TRIP to begin logging.</div>';return;}
  list.innerHTML=visible.map(e=>{
    if(e.type==='intersection'){
      const turnColor=e.turnDirection==='RIGHT TURN'?'#f59e0b':e.turnDirection==='LEFT TURN'?'#3b82f6':e.turnDirection==='U-TURN'?'#ef4444':'#2ecc71';
      const typeColor=e.intType==='CONGESTED'?'#ef4444':e.intType==='LONG CYCLE'||e.intType==='RED LIGHT'?'#f59e0b':'#2ecc71';
      return`<div class="log-entry type-intersection" style="border-left-color:${typeColor}">
        <div class="log-entry-top">
          <span class="log-type intersection" style="color:${typeColor}">${e.intType||'INTERSECTION'}</span>
          <span style="font-family:var(--mono);font-size:9px;color:${turnColor};font-weight:700;">${e.turnArrow||''} ${e.turnDirection||''}</span>
          <span class="log-time">${e.time}</span>
        </div>
        <div class="log-details" style="font-size:12px;">${e.approachRoad||''} ${e.turnArrow||''} ${e.exitRoad||e.label}</div>
        <div class="log-details"><strong style="color:${typeColor}">${e.duration}</strong> &bull; in ${e.entrySpeed} km/h &bull; out ${e.exitSpeed} km/h${e.postedLimit?` &bull; limit ${e.postedLimit}`:''}${e.congestionStops>1?` &bull; ${e.congestionStops} stop/creep cycles`:''}</div>
        <div class="log-coords">${e.lat} ${e.lng} &bull; acc ${e.accuracy}m</div>
      </div>`;
    }
    if(e.type==='congestion'){
      return`<div class="log-entry" style="border-left:3px solid #ef4444">
        <div class="log-entry-top">
          <span class="log-type" style="color:#ef4444;font-size:9px;text-transform:uppercase;letter-spacing:1px;">ROAD CONGESTION</span>
          <span class="log-time">${e.time}</span>
        </div>
        <div class="log-details">${e.road} &mdash; <strong style="color:#ef4444">${e.duration}</strong></div>
        <div class="log-coords">${e.lat} ${e.lng}</div>
      </div>`;
    }
    if(e.type==='waypoint')return`<div class="log-entry type-waypoint"><div class="log-entry-top"><span class="log-type waypoint">WAYPOINT</span><span class="log-time">${e.time}</span></div><div class="log-details">${e.label} &mdash; ${e.speed} km/h &mdash; ${e.distance} km</div><div class="log-coords">${e.lat} ${e.lng}</div></div>`;
    if(e.type==='system')return`<div class="log-entry type-system"><div class="log-entry-top"><span class="log-type system">SYSTEM</span><span class="log-time">${e.time}</span></div><div class="log-details">${e.label}</div></div>`;
    return'';
  }).join('');
}

function haversine(lat1,lon1,lat2,lon2){const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function formatTimer(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),t=Math.floor((ms%1000)/100);return`${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}.${t}`;}
function showToast(msg,err=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' error':'');setTimeout(()=>t.className='toast',3000);}

// WAKE LOCK — keeps screen on in Android Chrome
let wakeLock = null;
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      showToast('Screen lock: ON');
      document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      });
    } catch(e) {
      // Wake lock not available or denied — silent fail
    }
  }
}
